<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Prymm Enterprises</title>
  <meta name="description" content="The page you requested was not found. Return to Prymm Enterprises homepage.">
  <style>
    :root{--ink:#18202d;--paper:#f5f4f0;--line:rgba(24,32,45,.22);--accent:#3158f5}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,var(--paper),#fff);color:var(--ink);padding:1rem}
    main{max-width:640px;padding:clamp(1.5rem,3vw,2.5rem);border:1px solid var(--line);background:#fff;border-radius:1rem;box-shadow:0 16px 42px rgba(24,32,45,.1)}
    h1{font-family:"Cabinet Grotesk","Helvetica Neue",Arial,sans-serif;line-height:1.1;letter-spacing:-.02em;margin:0 0 .5rem}
    p{margin:0 0 1.25rem;color:#3d485b}
    nav{display:flex;flex-wrap:wrap;gap:.75rem}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.75rem 1rem;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600}
    a.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  </style>
</head>
<body>
  <main>
    <h1>Page Not Found</h1>
    <p>Sorry, we couldn't find that page.</p>
    <nav aria-label="404 recovery links">
      <a class="primary" href="./">Back to Homepage</a>
      <a href="./#contact">Go to Contact Section</a>
    </nav>
  </main>
</body>
</html>
