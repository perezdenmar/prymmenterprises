<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Prymm Enterprises</title>
  <meta name="description" content="The page you requested was not found. Return to Prymm Enterprises homepage.">
  <style>
    :root,[data-theme="light"]{--ink:#151d2b;--paper:#f4f6fa;--surface:#fff;--line:rgba(21,31,48,.16);--accent:#1a4fb7;--muted:#4d5f7c}
    @media (prefers-color-scheme:dark){:root{--ink:#edf2fc;--paper:#090f1c;--surface:#0f182b;--line:rgba(233,241,255,.24);--accent:#7fa8ff;--muted:#b7c6e4}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;font-family:Inter,"Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink)}
    main{width:min(100%,680px);padding:clamp(1.5rem,4vw,2.75rem);border:1px solid var(--line);border-radius:.85rem;background:var(--surface)}
    h1{margin:0 0 .5rem;font-family:"Cabinet Grotesk","Helvetica Neue",Arial,sans-serif;line-height:1.1;letter-spacing:-.02em}
    p{margin:0 0 1.25rem;color:var(--muted)}
    nav{display:flex;flex-wrap:wrap;gap:.75rem}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.75rem 1rem;border-radius:.6rem;border:1px solid var(--line);text-decoration:none;color:inherit;font-weight:700}
    a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    :focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Page Not Found</h1>
    <p>Sorry, we couldn't find that page.</p>
    <nav aria-label="404 recovery links">
      <a class="primary" href="./">Back to Homepage</a>
      <a href="./#contact">Go to Contact Section</a>
    </nav>
  </main>
</body>
</html>
